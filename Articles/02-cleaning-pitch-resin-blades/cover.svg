<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bladeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="pitch" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#bg2)"/>
  <circle cx="650" cy="120" r="150" fill="#1e3a8a" opacity="0.25"/>
  <circle cx="100" cy="500" r="170" fill="#1e3a8a" opacity="0.2"/>

  <!-- saw blade -->
  <g transform="translate(420,300)">
    <circle r="185" fill="url(#bladeMetal)" stroke="#94a3b8" stroke-width="3"/>

    <!-- teeth -->
    <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5">
      <!-- 20 teeth generated by rotation -->
      <g id="tooth">
        <path d="M0 -185 L14 -205 L28 -185 Z"/>
      </g>
      <use href="#tooth" transform="rotate(18)"/>
      <use href="#tooth" transform="rotate(36)"/>
      <use href="#tooth" transform="rotate(54)"/>
      <use href="#tooth" transform="rotate(72)"/>
      <use href="#tooth" transform="rotate(90)"/>
      <use href="#tooth" transform="rotate(108)"/>
      <use href="#tooth" transform="rotate(126)"/>
      <use href="#tooth" transform="rotate(144)"/>
      <use href="#tooth" transform="rotate(162)"/>
      <use href="#tooth" transform="rotate(180)"/>
      <use href="#tooth" transform="rotate(198)"/>
      <use href="#tooth" transform="rotate(216)"/>
      <use href="#tooth" transform="rotate(234)"/>
      <use href="#tooth" transform="rotate(252)"/>
      <use href="#tooth" transform="rotate(270)"/>
      <use href="#tooth" transform="rotate(288)"/>
      <use href="#tooth" transform="rotate(306)"/>
      <use href="#tooth" transform="rotate(324)"/>
      <use href="#tooth" transform="rotate(342)"/>
    </g>

    <!-- gullets -->
    <circle r="150" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>

    <!-- arbor hole -->
    <circle r="26" fill="#1e293b"/>
    <circle r="26" fill="none" stroke="#64748b" stroke-width="2"/>

    <!-- pitch buildup blobs on several teeth -->
    <path d="M8 -178 C 26 -196, 30 -206, 14 -204 C -2 -202, -8 -190, 8 -178 Z" fill="url(#pitch)" opacity="0.9" transform="rotate(20)"/>
    <path d="M8 -178 C 26 -196, 30 -206, 14 -204 C -2 -202, -8 -190, 8 -178 Z" fill="url(#pitch)" opacity="0.85" transform="rotate(74)"/>
    <path d="M8 -178 C 26 -196, 30 -206, 14 -204 C -2 -202, -8 -190, 8 -178 Z" fill="url(#pitch)" opacity="0.8" transform="rotate(128)"/>
    <path d="M8 -178 C 26 -196, 30 -206, 14 -204 C -2 -202, -8 -190, 8 -178 Z" fill="url(#pitch)" opacity="0.85" transform="rotate(200)"/>
    <path d="M8 -178 C 26 -196, 30 -206, 14 -204 C -2 -202, -8 -190, 8 -178 Z" fill="url(#pitch)" opacity="0.8" transform="rotate(255)"/>
    <path d="M8 -178 C 26 -196, 30 -206, 14 -204 C -2 -202, -8 -190, 8 -178 Z" fill="url(#pitch)" opacity="0.85" transform="rotate(312)"/>
  </g>

  <!-- cleaning brush sweeping in from lower left -->
  <g transform="translate(115,470) rotate(-32)">
    <rect x="0" y="0" width="150" height="22" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="150" y="-6" width="70" height="34" rx="6" fill="#f97316"/>
    <g stroke="#facc15" stroke-width="4" stroke-linecap="round">
      <line x1="150" y1="0" x2="185" y2="-22"/>
      <line x1="162" y1="6" x2="200" y2="-16"/>
      <line x1="174" y1="12" x2="214" y2="-8"/>
      <line x1="150" y1="22" x2="182" y2="42"/>
      <line x1="162" y1="16" x2="198" y2="34"/>
      <line x1="174" y1="10" x2="212" y2="26"/>
    </g>
  </g>

  <!-- drip / cleaner droplets -->
  <g fill="#e2e8f0" opacity="0.75">
    <path d="M540 470 C540 458, 552 448, 552 448 C552 448, 564 458, 564 470 C564 478, 557 484, 552 484 C547 484, 540 478, 540 470 Z"/>
    <path d="M590 505 C590 496, 599 488, 599 488 C599 488, 608 496, 608 505 C608 511, 603 516, 599 516 C595 516, 590 511, 590 505 Z"/>
  </g>
</svg>
