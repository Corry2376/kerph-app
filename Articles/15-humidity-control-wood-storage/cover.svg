<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>

  <!-- subtle humidity wave backdrop -->
  <path d="M0 130 Q200 100 400 130 T800 130" stroke="#2563eb" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M0 160 Q200 190 400 160 T800 160" stroke="#2563eb" stroke-width="3" fill="none" opacity="0.3"/>

  <!-- stickered lumber stack, angled slightly for depth -->
  <g transform="translate(120,260)">
    <!-- support rails -->
    <rect x="-10" y="150" width="16" height="70" fill="#334155"/>
    <rect x="470" y="150" width="16" height="70" fill="#334155"/>

    <!-- layer 1 -->
    <rect x="0" y="150" width="480" height="26" rx="3" fill="#b45309"/>
    <rect x="10" y="176" width="14" height="14" fill="#78350f"/>
    <rect x="230" y="176" width="14" height="14" fill="#78350f"/>
    <rect x="450" y="176" width="14" height="14" fill="#78350f"/>

    <!-- layer 2 -->
    <rect x="0" y="112" width="480" height="26" rx="3" fill="#c2760f"/>
    <rect x="10" y="138" width="14" height="14" fill="#78350f"/>
    <rect x="230" y="138" width="14" height="14" fill="#78350f"/>
    <rect x="450" y="138" width="14" height="14" fill="#78350f"/>

    <!-- layer 3 -->
    <rect x="0" y="74" width="480" height="26" rx="3" fill="#b45309"/>
    <rect x="10" y="100" width="14" height="14" fill="#78350f"/>
    <rect x="230" y="100" width="14" height="14" fill="#78350f"/>
    <rect x="450" y="100" width="14" height="14" fill="#78350f"/>

    <!-- layer 4 -->
    <rect x="0" y="36" width="480" height="26" rx="3" fill="#c2760f"/>
  </g>

  <!-- airflow arrows between boards -->
  <g stroke="#e2e8f0" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M40 400 h30 M60 393 l10 7 -10 7"/>
    <path d="M40 362 h30 M60 355 l10 7 -10 7"/>
    <path d="M40 324 h30 M60 317 l10 7 -10 7"/>
  </g>

  <!-- hygrometer device, right side -->
  <g transform="translate(560,240)">
    <rect x="0" y="0" width="170" height="130" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <rect x="16" y="18" width="138" height="60" rx="8" fill="#0f172a"/>
    <text x="85" y="58" font-family="Arial, sans-serif" font-size="34" fill="#facc15" text-anchor="middle" font-weight="700">40%</text>
    <circle cx="30" cy="104" r="8" fill="#f97316"/>
    <circle cx="58" cy="104" r="8" fill="#334155"/>
    <circle cx="86" cy="104" r="8" fill="#334155"/>
  </g>

  <!-- droplet + sun icons flanking hygrometer to suggest seasonal swing -->
  <g transform="translate(600,400)">
    <path d="M20 0 C32 20 32 38 20 38 C8 38 8 20 20 0 Z" fill="#60a5fa"/>
  </g>
  <g transform="translate(700,395)">
    <circle cx="20" cy="20" r="14" fill="#facc15"/>
    <g stroke="#facc15" stroke-width="4" stroke-linecap="round">
      <line x1="20" y1="-4" x2="20" y2="4"/>
      <line x1="20" y1="36" x2="20" y2="44"/>
      <line x1="-4" y1="20" x2="4" y2="20"/>
      <line x1="36" y1="20" x2="44" y2="20"/>
    </g>
  </g>
</svg>
