<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cup6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cup6b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#bg6)"/>
  <circle cx="120" cy="480" r="180" fill="#1e3a8a" opacity="0.3"/>
  <circle cx="660" cy="120" r="150" fill="#1e3a8a" opacity="0.25"/>

  <!-- sound wave rings emanating from center-left (tool) -->
  <g transform="translate(230,300)" fill="none" stroke="#facc15" opacity="0.55">
    <circle r="70" stroke-width="4"/>
    <circle r="115" stroke-width="4" opacity="0.4"/>
    <circle r="160" stroke-width="4" opacity="0.25"/>
  </g>

  <!-- simple tool silhouette (router) as noise source -->
  <g transform="translate(180,255)">
    <rect x="0" y="0" width="90" height="90" rx="14" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <circle cx="45" cy="45" r="18" fill="#1e293b"/>
    <rect x="35" y="90" width="20" height="40" rx="6" fill="#1e293b"/>
    <rect x="20" y="128" width="50" height="14" rx="4" fill="#0f172a"/>
  </g>

  <!-- dB burst lines -->
  <g stroke="#facc15" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="330" y1="210" x2="355" y2="195"/>
    <line x1="335" y1="240" x2="365" y2="235"/>
    <line x1="330" y1="270" x2="360" y2="278"/>
  </g>

  <!-- large earmuffs, centered right -->
  <g transform="translate(430,150)">
    <path d="M40 210 Q40 20 210 20 Q380 20 380 210" fill="none" stroke="#e2e8f0" stroke-width="26" stroke-linecap="round"/>
    <!-- left cup -->
    <g transform="translate(-10,190)">
      <ellipse cx="50" cy="90" rx="55" ry="80" fill="url(#cup6)" stroke="#9a3412" stroke-width="4"/>
      <ellipse cx="50" cy="90" rx="30" ry="52" fill="#1e293b" opacity="0.55"/>
    </g>
    <!-- right cup -->
    <g transform="translate(360,190)">
      <ellipse cx="50" cy="90" rx="55" ry="80" fill="url(#cup6b)" stroke="#9a3412" stroke-width="4"/>
      <ellipse cx="50" cy="90" rx="30" ry="52" fill="#1e293b" opacity="0.55"/>
    </g>
  </g>

  <!-- foam earplug pair, lower area for variety -->
  <g transform="translate(560,440)">
    <ellipse cx="0" cy="0" rx="26" ry="34" fill="#facc15"/>
    <ellipse cx="60" cy="20" rx="26" ry="34" fill="#e2e8f0"/>
  </g>
</svg>
