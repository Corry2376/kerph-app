<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sawTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="sawBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg12)"/>

  <!-- ambient glow -->
  <circle cx="600" cy="140" r="220" fill="#f97316" opacity="0.07"/>
  <circle cx="160" cy="480" r="200" fill="#facc15" opacity="0.05"/>

  <!-- floor line -->
  <line x1="60" y1="490" x2="740" y2="490" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- motion streak lines showing the tool rolling -->
  <g stroke="#facc15" stroke-width="5" stroke-linecap="round" opacity="0.45">
    <line x1="90" y1="330" x2="170" y2="330"/>
    <line x1="80" y1="380" x2="180" y2="380"/>
    <line x1="95" y1="430" x2="165" y2="430"/>
  </g>

  <!-- table saw group -->
  <g transform="translate(400 330)">
    <!-- saw top surface -->
    <rect x="-190" y="-70" width="380" height="46" rx="8" fill="url(#sawTop)"/>
    <line x1="-190" y1="-47" x2="190" y2="-47" stroke="#94a3b8" stroke-width="2" opacity="0.6"/>

    <!-- blade slot + blade -->
    <rect x="-14" y="-95" width="10" height="30" fill="#1e293b"/>
    <path d="M -9 -100 L 1 -100 L 6 -30 L -14 -30 Z" fill="#1e293b" opacity="0.85"/>

    <!-- rip fence -->
    <rect x="30" y="-78" width="10" height="60" rx="3" fill="#94a3b8"/>
    <rect x="30" y="-82" width="120" height="10" rx="4" fill="#cbd5e1"/>

    <!-- saw cabinet body -->
    <rect x="-140" y="-24" width="280" height="120" rx="10" fill="url(#sawBody)"/>
    <rect x="-140" y="-24" width="280" height="18" fill="#fb923c" opacity="0.7"/>

    <!-- control switch -->
    <rect x="-120" y="10" width="34" height="20" rx="4" fill="#1e293b"/>
    <circle cx="-103" cy="20" r="6" fill="#facc15"/>

    <!-- mobile base frame beneath cabinet -->
    <rect x="-150" y="96" width="300" height="18" rx="6" fill="#1e293b"/>

    <!-- casters -->
    <g>
      <circle cx="-115" cy="130" r="24" fill="#1e293b"/>
      <circle cx="-115" cy="130" r="24" fill="none" stroke="#facc15" stroke-width="4"/>
      <circle cx="-115" cy="130" r="7" fill="#facc15"/>

      <circle cx="115" cy="130" r="24" fill="#1e293b"/>
      <circle cx="115" cy="130" r="24" fill="none" stroke="#facc15" stroke-width="4"/>
      <circle cx="115" cy="130" r="7" fill="#facc15"/>

      <circle cx="0" cy="130" r="24" fill="#1e293b"/>
      <circle cx="0" cy="130" r="24" fill="none" stroke="#facc15" stroke-width="4"/>
      <circle cx="0" cy="130" r="7" fill="#facc15"/>
    </g>

    <!-- lock lever accent -->
    <g transform="translate(150 60)">
      <rect x="0" y="0" width="10" height="34" rx="4" fill="#e2e8f0"/>
      <rect x="-6" y="30" width="22" height="10" rx="4" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- caster wheel icon ghosted top right, representing "which tools roll" -->
  <g transform="translate(660 130)" opacity="0.5">
    <circle r="36" fill="none" stroke="#e2e8f0" stroke-width="4"/>
    <circle r="10" fill="#e2e8f0"/>
    <line x1="-36" y1="0" x2="-10" y2="0" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="36" y1="0" x2="10" y2="0" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="0" y1="-36" x2="0" y2="-10" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="0" y1="36" x2="0" y2="10" stroke="#e2e8f0" stroke-width="3"/>
  </g>

  <!-- accent dots -->
  <circle cx="720" cy="470" r="5" fill="#facc15" opacity="0.6"/>
  <circle cx="110" cy="200" r="4" fill="#f97316" opacity="0.5"/>
  <circle cx="200" cy="150" r="3.5" fill="#e2e8f0" opacity="0.5"/>
</svg>
