<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="block" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="paperCoarse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="paperFine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- soft ambient glow -->
  <circle cx="620" cy="150" r="220" fill="#f97316" opacity="0.07"/>
  <circle cx="150" cy="480" r="180" fill="#facc15" opacity="0.05"/>

  <!-- wood plank on a slight angle -->
  <g transform="translate(400 330) rotate(-6)">
    <rect x="-260" y="-90" width="520" height="180" rx="10" fill="url(#wood)"/>
    <!-- wood grain lines -->
    <path d="M -250 -60 Q -100 -50 60 -60 T 250 -55" stroke="#7c2d12" stroke-width="3" fill="none" opacity="0.4"/>
    <path d="M -250 -20 Q -80 -10 80 -22 T 250 -15" stroke="#7c2d12" stroke-width="3" fill="none" opacity="0.35"/>
    <path d="M -250 20 Q -90 30 70 18 T 250 25" stroke="#7c2d12" stroke-width="3" fill="none" opacity="0.35"/>
    <path d="M -250 60 Q -100 68 60 58 T 250 65" stroke="#7c2d12" stroke-width="3" fill="none" opacity="0.4"/>

    <!-- sanded lighter patch under the block -->
    <ellipse cx="20" cy="-5" rx="140" ry="70" fill="#facc15" opacity="0.18"/>

    <!-- sanding block -->
    <g transform="translate(15 -10)">
      <rect x="-85" y="-38" width="170" height="76" rx="14" fill="url(#block)"/>
      <rect x="-85" y="-38" width="170" height="76" rx="14" fill="none" stroke="#c2410c" stroke-width="3"/>
      <rect x="-95" y="30" width="190" height="14" rx="6" fill="#e2e8f0"/>
    </g>

    <!-- motion / cutting streaks behind block -->
    <g stroke="#facc15" stroke-width="4" stroke-linecap="round" opacity="0.55">
      <line x1="-200" y1="-30" x2="-140" y2="-30"/>
      <line x1="-210" y1="0" x2="-150" y2="0"/>
      <line x1="-200" y1="30" x2="-140" y2="30"/>
    </g>

    <!-- dust particles of varying size = grit metaphor -->
    <g fill="#e2e8f0" opacity="0.85">
      <circle cx="-235" cy="-45" r="4"/>
      <circle cx="-215" cy="-60" r="2.5"/>
      <circle cx="-250" cy="-15" r="3"/>
      <circle cx="-225" cy="10" r="2"/>
      <circle cx="-260" cy="45" r="3.5"/>
      <circle cx="-190" cy="-70" r="2"/>
      <circle cx="-205" cy="55" r="2.5"/>
    </g>
  </g>

  <!-- fanned sandpaper sheets, lower left, coarse to fine -->
  <g transform="translate(150 470)">
    <g transform="rotate(-18)">
      <rect x="0" y="0" width="150" height="100" rx="6" fill="url(#paperCoarse)" stroke="#b45309" stroke-width="2"/>
      <g fill="#b45309" opacity="0.55">
        <circle cx="20" cy="20" r="4"/><circle cx="45" cy="35" r="4.5"/><circle cx="75" cy="15" r="4"/>
        <circle cx="105" cy="40" r="4.5"/><circle cx="30" cy="65" r="4"/><circle cx="65" cy="80" r="4.5"/>
        <circle cx="120" cy="70" r="4"/><circle cx="95" cy="90" r="4"/>
      </g>
    </g>
    <g transform="rotate(-4) translate(35 -10)">
      <rect x="0" y="0" width="150" height="100" rx="6" fill="#fdba74" stroke="#c2410c" stroke-width="2"/>
      <g fill="#c2410c" opacity="0.55">
        <circle cx="15" cy="15" r="2.6"/><circle cx="35" cy="30" r="2.6"/><circle cx="55" cy="12" r="2.6"/>
        <circle cx="75" cy="35" r="2.6"/><circle cx="95" cy="18" r="2.6"/><circle cx="115" cy="32" r="2.6"/>
        <circle cx="25" cy="55" r="2.6"/><circle cx="50" cy="70" r="2.6"/><circle cx="80" cy="60" r="2.6"/>
        <circle cx="105" cy="75" r="2.6"/><circle cx="130" cy="50" r="2.6"/><circle cx="60" cy="90" r="2.6"/>
      </g>
    </g>
    <g transform="rotate(10) translate(75 -5)">
      <rect x="0" y="0" width="150" height="100" rx="6" fill="url(#paperFine)" stroke="#94a3b8" stroke-width="2"/>
      <g fill="#64748b" opacity="0.5">
        <circle cx="12" cy="12" r="1.4"/><circle cx="24" cy="24" r="1.4"/><circle cx="36" cy="14" r="1.4"/>
        <circle cx="48" cy="28" r="1.4"/><circle cx="60" cy="16" r="1.4"/><circle cx="72" cy="30" r="1.4"/>
        <circle cx="84" cy="14" r="1.4"/><circle cx="96" cy="26" r="1.4"/><circle cx="108" cy="18" r="1.4"/>
        <circle cx="120" cy="30" r="1.4"/><circle cx="18" cy="45" r="1.4"/><circle cx="34" cy="55" r="1.4"/>
        <circle cx="50" cy="46" r="1.4"/><circle cx="66" cy="58" r="1.4"/><circle cx="82" cy="48" r="1.4"/>
        <circle cx="98" cy="60" r="1.4"/><circle cx="114" cy="50" r="1.4"/><circle cx="130" cy="62" r="1.4"/>
        <circle cx="26" cy="78" r="1.4"/><circle cx="46" cy="85" r="1.4"/><circle cx="66" cy="80" r="1.4"/>
        <circle cx="86" cy="88" r="1.4"/><circle cx="106" cy="80" r="1.4"/>
      </g>
    </g>
  </g>

  <!-- corner accent -->
  <circle cx="700" cy="500" r="6" fill="#facc15" opacity="0.7"/>
  <circle cx="730" cy="470" r="4" fill="#f97316" opacity="0.6"/>
  <circle cx="670" cy="460" r="3" fill="#e2e8f0" opacity="0.5"/>
</svg>
