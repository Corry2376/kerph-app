<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maskBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- faint background dust particles -->
  <g fill="#e2e8f0" opacity="0.12">
    <circle cx="120" cy="140" r="4"/>
    <circle cx="660" cy="110" r="3"/>
    <circle cx="700" cy="470" r="5"/>
    <circle cx="90" cy="450" r="3"/>
    <circle cx="180" cy="500" r="2.5"/>
    <circle cx="620" cy="500" r="4"/>
  </g>

  <!-- respirator straps -->
  <path d="M 260 300 Q 150 260 150 220" stroke="#475569" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 540 300 Q 650 260 650 220" stroke="#475569" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 270 360 Q 150 380 150 340" stroke="#475569" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 530 360 Q 650 380 650 340" stroke="#475569" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- main respirator body -->
  <g>
    <path d="M 250 260
             C 250 190, 320 150, 400 150
             C 480 150, 550 190, 550 260
             C 550 330, 500 400, 400 400
             C 300 400, 250 330, 250 260 Z"
          fill="url(#maskBody)" stroke="#0f172a" stroke-width="4"/>

    <!-- nose bridge highlight -->
    <path d="M 340 180 Q 400 160 460 180" stroke="#64748b" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- left cartridge -->
    <g>
      <circle cx="290" cy="300" r="52" fill="#1e293b" stroke="#f97316" stroke-width="6"/>
      <circle cx="290" cy="300" r="34" fill="#334155" stroke="#0f172a" stroke-width="3"/>
      <circle cx="290" cy="300" r="10" fill="#f97316"/>
    </g>

    <!-- right cartridge -->
    <g>
      <circle cx="510" cy="300" r="52" fill="#1e293b" stroke="#f97316" stroke-width="6"/>
      <circle cx="510" cy="300" r="34" fill="#334155" stroke="#0f172a" stroke-width="3"/>
      <circle cx="510" cy="300" r="10" fill="#f97316"/>
    </g>

    <!-- exhalation valve -->
    <circle cx="400" cy="330" r="26" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <circle cx="400" cy="330" r="12" fill="#0f172a"/>
  </g>

  <!-- filtered particles turned away above cartridges, in amber -->
  <g fill="#facc15" opacity="0.85">
    <circle cx="230" cy="200" r="5"/>
    <circle cx="205" cy="230" r="4"/>
    <circle cx="245" cy="150" r="3.5"/>
    <circle cx="560" cy="200" r="5"/>
    <circle cx="590" cy="230" r="4"/>
    <circle cx="555" cy="150" r="3.5"/>
  </g>

  <!-- clean air check mark below chin, subtle -->
  <g transform="translate(400 460)" opacity="0.9">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#f97316" stroke-width="5"/>
    <path d="M -14 0 L -4 12 L 16 -14" stroke="#f97316" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
