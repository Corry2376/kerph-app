<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cleatStrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="holder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg11)"/>

  <!-- ambient glow -->
  <circle cx="120" cy="100" r="200" fill="#facc15" opacity="0.06"/>
  <circle cx="680" cy="500" r="220" fill="#0f172a" opacity="0.15"/>

  <!-- wall panel backdrop -->
  <rect x="90" y="90" width="620" height="420" rx="14" fill="#1e293b" opacity="0.35"/>

  <!-- horizontal cleat strips -->
  <g>
    <rect x="120" y="150" width="560" height="20" rx="4" fill="url(#cleatStrip)"/>
    <rect x="120" y="150" width="560" height="6" fill="#fed7aa" opacity="0.6"/>

    <rect x="120" y="270" width="560" height="20" rx="4" fill="url(#cleatStrip)"/>
    <rect x="120" y="270" width="560" height="6" fill="#fed7aa" opacity="0.6"/>

    <rect x="120" y="390" width="560" height="20" rx="4" fill="url(#cleatStrip)"/>
    <rect x="120" y="390" width="560" height="6" fill="#fed7aa" opacity="0.6"/>
  </g>

  <!-- tool holder 1: drill holder block hanging on top row -->
  <g transform="translate(210 170)">
    <rect x="0" y="0" width="130" height="90" rx="10" fill="url(#holder)"/>
    <rect x="0" y="0" width="130" height="14" fill="#fbbf24" opacity="0.8"/>
    <!-- drill silhouette -->
    <g fill="#1e293b" opacity="0.85">
      <rect x="25" y="30" width="55" height="26" rx="6"/>
      <rect x="45" y="52" width="18" height="30" rx="4"/>
      <rect x="80" y="38" width="26" height="10" rx="3"/>
    </g>
  </g>

  <!-- tool holder 2: saw holder hanging on middle row -->
  <g transform="translate(420 290)">
    <rect x="0" y="0" width="160" height="80" rx="10" fill="#e2e8f0"/>
    <rect x="0" y="0" width="160" height="14" fill="#f8fafc" opacity="0.9"/>
    <!-- handsaw silhouette -->
    <g fill="#1e293b" opacity="0.85">
      <path d="M15 55 L120 20 L130 30 L25 65 Z"/>
      <path d="M120 20 Q145 15 148 32 Q150 45 130 40 Z"/>
    </g>
  </g>

  <!-- small clamp/wrench holder on top row -->
  <g transform="translate(430 172)">
    <rect x="0" y="0" width="90" height="70" rx="8" fill="url(#cleatStrip)" opacity="0.9"/>
    <g stroke="#1e293b" stroke-width="6" stroke-linecap="round" opacity="0.8">
      <line x1="20" y1="18" x2="70" y2="18"/>
      <line x1="20" y1="34" x2="60" y2="34"/>
      <line x1="20" y1="50" x2="65" y2="50"/>
    </g>
  </g>

  <!-- small drawer module hanging on bottom row -->
  <g transform="translate(250 410)">
    <rect x="0" y="0" width="150" height="70" rx="8" fill="#0f172a" opacity="0.75"/>
    <rect x="10" y="10" width="130" height="20" rx="4" fill="#334155"/>
    <rect x="10" y="38" width="130" height="20" rx="4" fill="#334155"/>
    <circle cx="75" cy="20" r="3" fill="#facc15"/>
    <circle cx="75" cy="48" r="3" fill="#facc15"/>
  </g>

  <!-- jig hanging on bottom row -->
  <g transform="translate(470 405)">
    <rect x="0" y="0" width="120" height="75" rx="8" fill="url(#holder)" opacity="0.95"/>
    <rect x="15" y="15" width="90" height="10" rx="4" fill="#1e293b" opacity="0.6"/>
    <rect x="15" y="32" width="60" height="10" rx="4" fill="#1e293b" opacity="0.6"/>
    <rect x="15" y="49" width="75" height="10" rx="4" fill="#1e293b" opacity="0.6"/>
  </g>

  <!-- subtle bevel-lock indicator arrows -->
  <g fill="#f97316" opacity="0.55">
    <path d="M275 165 l-8 -12 l16 0 Z"/>
    <path d="M500 285 l-8 -12 l16 0 Z"/>
    <path d="M325 405 l-8 -12 l16 0 Z"/>
  </g>

  <!-- floating accent dots -->
  <circle cx="660" cy="140" r="5" fill="#facc15" opacity="0.6"/>
  <circle cx="150" cy="460" r="4" fill="#f97316" opacity="0.5"/>
  <circle cx="640" cy="450" r="3.5" fill="#e2e8f0" opacity="0.5"/>
</svg>
