<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="wax" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#bg)"/>

  <!-- soft ambient circles -->
  <circle cx="120" cy="90" r="140" fill="#2563eb" opacity="0.18"/>
  <circle cx="700" cy="500" r="180" fill="#2563eb" opacity="0.15"/>

  <!-- cast iron table top -->
  <rect x="130" y="110" width="540" height="380" rx="20" fill="url(#metal)" stroke="#94a3b8" stroke-width="3"/>
  <rect x="150" y="130" width="500" height="340" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>

  <!-- miter slots -->
  <rect x="270" y="130" width="16" height="340" rx="3" fill="#64748b"/>
  <rect x="270" y="130" width="16" height="340" rx="3" fill="#1e293b" opacity="0.25"/>
  <rect x="516" y="130" width="16" height="340" rx="3" fill="#64748b"/>
  <rect x="516" y="130" width="16" height="340" rx="3" fill="#1e293b" opacity="0.25"/>

  <!-- throat plate -->
  <rect x="365" y="255" width="70" height="90" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="395" y="255" width="10" height="90" fill="#1e293b"/>

  <!-- polish / wax shine sweep -->
  <path d="M150 470 C 260 380, 420 380, 600 190 C 630 160, 655 150, 660 140 L 660 170 C 630 210, 560 280, 470 360 C 380 440, 280 480, 150 500 Z" fill="url(#shine)"/>

  <!-- wax tin, bottom right -->
  <g transform="translate(560,410)">
    <ellipse cx="60" cy="88" rx="46" ry="10" fill="#0f172a" opacity="0.25"/>
    <rect x="16" y="20" width="88" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5"/>
    <ellipse cx="60" cy="20" rx="44" ry="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
    <ellipse cx="60" cy="18" rx="30" ry="8" fill="url(#wax)"/>
    <rect x="26" y="30" width="68" height="6" rx="3" fill="#f97316" opacity="0.85"/>
  </g>

  <!-- folded cloth, bottom left -->
  <g transform="translate(150,420)">
    <path d="M0 60 L20 10 L110 10 L130 60 C 95 78, 35 78, 0 60 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5"/>
    <path d="M30 40 L100 40" stroke="#f97316" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M22 52 L108 52" stroke="#94a3b8" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- subtle corner rivets -->
  <circle cx="160" cy="140" r="6" fill="#94a3b8"/>
  <circle cx="640" cy="140" r="6" fill="#94a3b8"/>
  <circle cx="160" cy="460" r="6" fill="#94a3b8"/>
  <circle cx="640" cy="460" r="6" fill="#94a3b8"/>
</svg>
