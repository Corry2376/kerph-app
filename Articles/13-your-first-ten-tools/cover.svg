<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b4a9e"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- pegboard panel -->
  <rect x="130" y="90" width="540" height="420" rx="14" fill="url(#board)" stroke="#334f9e" stroke-width="2"/>
  <g fill="#16295e" opacity="0.55">
    <circle cx="180" cy="140" r="4"/><circle cx="240" cy="140" r="4"/><circle cx="300" cy="140" r="4"/><circle cx="360" cy="140" r="4"/><circle cx="420" cy="140" r="4"/><circle cx="480" cy="140" r="4"/><circle cx="540" cy="140" r="4"/><circle cx="600" cy="140" r="4"/><circle cx="620" cy="140" r="4"/>
    <circle cx="180" cy="200" r="4"/><circle cx="240" cy="200" r="4"/><circle cx="300" cy="200" r="4"/><circle cx="360" cy="200" r="4"/><circle cx="420" cy="200" r="4"/><circle cx="480" cy="200" r="4"/><circle cx="540" cy="200" r="4"/><circle cx="600" cy="200" r="4"/><circle cx="620" cy="200" r="4"/>
    <circle cx="180" cy="260" r="4"/><circle cx="240" cy="260" r="4"/><circle cx="300" cy="260" r="4"/><circle cx="360" cy="260" r="4"/><circle cx="420" cy="260" r="4"/><circle cx="480" cy="260" r="4"/><circle cx="540" cy="260" r="4"/><circle cx="600" cy="260" r="4"/><circle cx="620" cy="260" r="4"/>
    <circle cx="180" cy="320" r="4"/><circle cx="240" cy="320" r="4"/><circle cx="300" cy="320" r="4"/><circle cx="360" cy="320" r="4"/><circle cx="420" cy="320" r="4"/><circle cx="480" cy="320" r="4"/><circle cx="540" cy="320" r="4"/><circle cx="600" cy="320" r="4"/><circle cx="620" cy="320" r="4"/>
    <circle cx="180" cy="380" r="4"/><circle cx="240" cy="380" r="4"/><circle cx="300" cy="380" r="4"/><circle cx="360" cy="380" r="4"/><circle cx="420" cy="380" r="4"/><circle cx="480" cy="380" r="4"/><circle cx="540" cy="380" r="4"/><circle cx="600" cy="380" r="4"/><circle cx="620" cy="380" r="4"/>
    <circle cx="180" cy="440" r="4"/><circle cx="240" cy="440" r="4"/><circle cx="300" cy="440" r="4"/><circle cx="360" cy="440" r="4"/><circle cx="420" cy="440" r="4"/><circle cx="480" cy="440" r="4"/><circle cx="540" cy="440" r="4"/><circle cx="600" cy="440" r="4"/><circle cx="620" cy="440" r="4"/>
    <circle cx="180" cy="470" r="4"/><circle cx="240" cy="470" r="4"/><circle cx="300" cy="470" r="4"/><circle cx="360" cy="470" r="4"/><circle cx="420" cy="470" r="4"/><circle cx="480" cy="470" r="4"/><circle cx="540" cy="470" r="4"/><circle cx="600" cy="470" r="4"/><circle cx="620" cy="470" r="4"/>
  </g>

  <!-- hand saw -->
  <g transform="translate(190,150)">
    <path d="M0 0 L120 40 L108 62 L-4 30 Z" fill="#e2e8f0"/>
    <path d="M108 62 L96 84 L-14 50 L-4 30 Z" fill="#cbd5e1"/>
    <path d="M-4 30 L-70 10 Q-84 6 -82 20 L-72 46 Q-68 58 -54 50 L-14 50 Z" fill="#f97316"/>
  </g>

  <!-- tape measure -->
  <g transform="translate(360,150)">
    <circle cx="40" cy="40" r="44" fill="#facc15"/>
    <circle cx="40" cy="40" r="44" fill="none" stroke="#eab308" stroke-width="3"/>
    <rect x="14" y="24" width="52" height="32" rx="4" fill="#1e293b"/>
    <rect x="60" y="34" width="34" height="12" rx="2" fill="#e2e8f0"/>
  </g>

  <!-- drill -->
  <g transform="translate(520,150)">
    <rect x="0" y="10" width="80" height="34" rx="8" fill="#e2e8f0"/>
    <rect x="70" y="0" width="20" height="24" rx="4" fill="#94a3b8"/>
    <rect x="20" y="40" width="22" height="60" rx="6" fill="#f97316"/>
    <rect x="-14" y="18" width="16" height="10" rx="2" fill="#94a3b8"/>
  </g>

  <!-- clamp -->
  <g transform="translate(190,270)">
    <rect x="0" y="18" width="130" height="10" rx="4" fill="#94a3b8"/>
    <rect x="0" y="0" width="14" height="46" rx="3" fill="#e2e8f0"/>
    <rect x="108" y="0" width="14" height="46" rx="3" fill="#e2e8f0"/>
    <rect x="112" y="30" width="30" height="10" rx="3" fill="#facc15"/>
    <rect x="150" y="18" width="10" height="34" rx="3" fill="#facc15"/>
  </g>

  <!-- chisel -->
  <g transform="translate(400,270)">
    <rect x="0" y="20" width="50" height="14" rx="5" fill="#f97316"/>
    <path d="M50 22 L108 26 L108 30 L50 32 Z" fill="#cbd5e1"/>
    <path d="M108 26 L120 28 L108 30 Z" fill="#e2e8f0"/>
  </g>

  <!-- square -->
  <g transform="translate(560,260)">
    <rect x="0" y="0" width="16" height="90" rx="3" fill="#94a3b8"/>
    <rect x="0" y="74" width="70" height="16" rx="3" fill="#94a3b8"/>
  </g>

  <!-- safety glasses + earmuffs -->
  <g transform="translate(190,400)">
    <path d="M0 20 Q20 0 40 20 Q60 0 80 20" stroke="#e2e8f0" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="16" cy="24" r="16" fill="none" stroke="#e2e8f0" stroke-width="6"/>
    <circle cx="64" cy="24" r="16" fill="none" stroke="#e2e8f0" stroke-width="6"/>
    <circle cx="16" cy="24" r="10" fill="#facc15" opacity="0.55"/>
    <circle cx="64" cy="24" r="10" fill="#facc15" opacity="0.55"/>
  </g>
  <g transform="translate(330,392)">
    <path d="M0 34 Q20 -10 70 34" stroke="#e2e8f0" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="6" cy="42" rx="16" ry="22" fill="#f97316"/>
    <ellipse cx="64" cy="42" rx="16" ry="22" fill="#f97316"/>
  </g>

  <!-- sander -->
  <g transform="translate(470,395)">
    <ellipse cx="45" cy="55" rx="46" ry="16" fill="#facc15"/>
    <rect x="14" y="10" width="62" height="34" rx="10" fill="#e2e8f0"/>
    <rect x="34" y="-10" width="22" height="24" rx="6" fill="#94a3b8"/>
  </g>

  <!-- router -->
  <g transform="translate(600,390)">
    <rect x="10" y="0" width="26" height="50" rx="6" fill="#e2e8f0"/>
    <path d="M0 50 L46 50 L40 70 L6 70 Z" fill="#94a3b8"/>
    <rect x="16" y="70" width="14" height="16" fill="#1e293b"/>
  </g>
</svg>
