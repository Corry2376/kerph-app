<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg17" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg17)"/>

  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <circle cx="400" cy="300" r="220" fill="none"/>
    <circle cx="400" cy="300" r="160" fill="none"/>
  </g>

  <!-- gear -->
  <g transform="translate(280,300)">
    <g fill="#1e3a8a" stroke="#2563eb" stroke-width="3">
      <circle r="90"/>
      <g id="teeth17">
        <rect x="-14" y="-108" width="28" height="30" rx="4"/>
      </g>
      <use href="#teeth17" transform="rotate(45)"/>
      <use href="#teeth17" transform="rotate(90)"/>
      <use href="#teeth17" transform="rotate(135)"/>
      <use href="#teeth17" transform="rotate(180)"/>
      <use href="#teeth17" transform="rotate(225)"/>
      <use href="#teeth17" transform="rotate(270)"/>
      <use href="#teeth17" transform="rotate(315)"/>
    </g>
    <circle r="40" fill="#0f172a"/>
  </g>

  <!-- wrench crossing the gear -->
  <g transform="translate(280,300) rotate(35)">
    <rect x="-160" y="-16" width="220" height="32" rx="10" fill="#f97316"/>
    <path d="M 60 -34 a 34 34 0 1 0 0.1 0 z M 60 -34 a 14 14 0 1 1 -0.1 0 z" fill="#f97316" fill-rule="evenodd"/>
    <rect x="-190" y="-24" width="40" height="48" rx="8" fill="#facc15"/>
  </g>

  <!-- oil can + checklist accent, right side -->
  <g transform="translate(560,220)">
    <path d="M -50 60 L 50 60 L 40 -30 Q 40 -60 10 -60 L -10 -60 Q -40 -60 -40 -30 Z" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <rect x="-8" y="-95" width="16" height="40" rx="6" fill="#64748b"/>
    <circle cx="0" cy="-20" r="10" fill="#facc15"/>
    <path d="M -32 30 Q 0 45 32 30" stroke="#1e293b" stroke-width="4" fill="none"/>
  </g>

  <g transform="translate(150,460)" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round">
    <path d="M 0 0 L 18 20 L 46 -20"/>
  </g>
  <rect x="60" y="450" width="140" height="16" rx="8" fill="#e2e8f0" opacity="0.85"/>

  <g transform="translate(150,510)" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round">
    <path d="M 0 0 L 18 20 L 46 -20"/>
  </g>
  <rect x="60" y="500" width="180" height="16" rx="8" fill="#e2e8f0" opacity="0.6"/>
</svg>
