<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg16" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blade16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg16)"/>

  <!-- faint grid texture -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- table saw side profile -->
  <g>
    <!-- cabinet base -->
    <rect x="230" y="330" width="340" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <!-- feet -->
    <rect x="250" y="480" width="26" height="30" fill="#0f172a"/>
    <rect x="524" y="480" width="26" height="30" fill="#0f172a"/>
    <!-- tabletop -->
    <rect x="160" y="300" width="480" height="34" rx="6" fill="#e2e8f0"/>
    <rect x="160" y="300" width="480" height="10" rx="5" fill="#f8fafc"/>
    <!-- fence rail -->
    <rect x="160" y="270" width="480" height="10" rx="4" fill="#94a3b8"/>
    <!-- fence -->
    <rect x="440" y="245" width="18" height="90" rx="3" fill="#cbd5e1"/>
    <rect x="440" y="245" width="18" height="14" rx="3" fill="#f8fafc"/>
    <!-- blade slot -->
    <rect x="330" y="296" width="8" height="38" fill="#0f172a"/>
    <!-- blade -->
    <circle cx="334" cy="300" r="95" fill="url(#blade16)" opacity="0.92"/>
    <circle cx="334" cy="300" r="95" fill="none" stroke="#0f172a" stroke-width="4"/>
    <circle cx="334" cy="300" r="14" fill="#0f172a"/>
    <!-- blade teeth suggestion -->
    <g stroke="#0f172a" stroke-width="3" opacity="0.5">
      <line x1="334" y1="207" x2="334" y2="222"/>
      <line x1="401" y1="233" x2="391" y2="244"/>
      <line x1="427" y1="300" x2="412" y2="300"/>
      <line x1="401" y1="367" x2="391" y2="356"/>
      <line x1="334" y1="393" x2="334" y2="378"/>
      <line x1="267" y1="367" x2="277" y2="356"/>
      <line x1="241" y1="300" x2="256" y2="300"/>
      <line x1="267" y1="233" x2="277" y2="244"/>
    </g>
    <!-- clipping mask so only the blade above the table shows -->
    <rect x="0" y="300" width="800" height="34" fill="url(#bg16)"/>
    <rect x="160" y="300" width="480" height="34" rx="6" fill="#e2e8f0"/>
    <rect x="160" y="300" width="480" height="10" rx="5" fill="#f8fafc"/>
  </g>

  <!-- ranking badge -->
  <g>
    <circle cx="660" cy="150" r="58" fill="#f97316"/>
    <circle cx="660" cy="150" r="58" fill="none" stroke="#facc15" stroke-width="4"/>
    <text x="660" y="172" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#0f172a" text-anchor="middle">10</text>
  </g>
</svg>
