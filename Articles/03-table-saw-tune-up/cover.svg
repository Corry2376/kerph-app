<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cabinet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="top3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#bg3)"/>
  <circle cx="120" cy="500" r="170" fill="#0f172a" opacity="0.18"/>
  <circle cx="680" cy="110" r="140" fill="#0f172a" opacity="0.16"/>

  <!-- table saw side view -->
  <g transform="translate(150,190)">
    <!-- cabinet base -->
    <path d="M40 250 L60 400 L340 400 L360 250 Z" fill="url(#cabinet)" stroke="#0f172a" stroke-width="3"/>
    <rect x="90" y="290" width="220" height="70" rx="6" fill="#1e293b" opacity="0.5"/>

    <!-- table top -->
    <rect x="0" y="210" width="400" height="46" rx="10" fill="url(#top3)" stroke="#94a3b8" stroke-width="3"/>
    <!-- miter slot -->
    <rect x="70" y="222" width="10" height="22" fill="#64748b"/>
    <rect x="320" y="222" width="10" height="22" fill="#64748b"/>

    <!-- blade through slot -->
    <path d="M175 60 A100 100 0 0 1 275 205 L225 210 A48 48 0 0 0 190 120 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="200" cy="150" r="4" fill="#1e293b"/>

    <!-- fence -->
    <rect x="230" y="150" width="14" height="60" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <rect x="230" y="150" width="150" height="14" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- combination square overlay -->
  <g transform="translate(500,330) rotate(-8)">
    <rect x="0" y="0" width="180" height="18" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="18" height="150" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <line x1="20" y1="9" x2="170" y2="9" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
    <line x1="9" y1="20" x2="9" y2="140" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- checklist clipboard -->
  <g transform="translate(555,90)">
    <rect x="0" y="10" width="150" height="190" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
    <rect x="50" y="0" width="50" height="24" rx="8" fill="#94a3b8"/>
    <g stroke="#cbd5e1" stroke-width="4">
      <line x1="20" y1="115" x2="130" y2="115"/>
      <line x1="20" y1="145" x2="130" y2="145"/>
      <line x1="20" y1="175" x2="100" y2="175"/>
    </g>
    <g stroke="#f97316" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M18 55 L28 65 L46 45"/>
      <path d="M18 85 L28 95 L46 75"/>
    </g>
  </g>

  <!-- stopwatch -->
  <g transform="translate(555,340)">
    <rect x="55" y="-6" width="20" height="16" rx="4" fill="#facc15"/>
    <circle cx="65" cy="70" r="72" fill="#1e293b" stroke="#f97316" stroke-width="8"/>
    <circle cx="65" cy="70" r="58" fill="none" stroke="#facc15" stroke-width="2" opacity="0.6"/>
    <line x1="65" y1="70" x2="65" y2="26" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
    <line x1="65" y1="70" x2="96" y2="86" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <circle cx="65" cy="70" r="6" fill="#facc15"/>
    <line x1="30" y1="-18" x2="45" y2="-2" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
