<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="plankLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c98a4b"/>
      <stop offset="100%" stop-color="#a66a34"/>
    </linearGradient>
    <linearGradient id="plankRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a868"/>
      <stop offset="100%" stop-color="#c98a4b"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- soft vignette circle -->
  <circle cx="400" cy="300" r="330" fill="#0f172a" opacity="0.08"/>

  <!-- the board, split down the middle: left = oil (matte), right = film (glossy) -->
  <g transform="translate(150 150)">
    <rect x="0" y="0" width="250" height="300" rx="10" fill="url(#plankLeft)" stroke="#0f172a" stroke-width="4"/>
    <!-- wood grain lines, matte side -->
    <g stroke="#8a5a2e" stroke-width="2.5" opacity="0.45" fill="none">
      <path d="M 20 40 Q 125 55 230 40"/>
      <path d="M 15 90 Q 125 105 235 90"/>
      <path d="M 20 150 Q 125 165 230 150"/>
      <path d="M 15 210 Q 125 225 235 210"/>
      <path d="M 20 260 Q 125 275 230 260"/>
    </g>
  </g>

  <g transform="translate(400 150)">
    <rect x="0" y="0" width="250" height="300" rx="10" fill="url(#plankRight)" stroke="#0f172a" stroke-width="4"/>
    <!-- wood grain lines, glossy side (still visible under film) -->
    <g stroke="#a5723c" stroke-width="2.5" opacity="0.35" fill="none">
      <path d="M 20 40 Q 125 55 230 40"/>
      <path d="M 15 90 Q 125 105 235 90"/>
      <path d="M 20 150 Q 125 165 230 150"/>
      <path d="M 15 210 Q 125 225 235 210"/>
      <path d="M 20 260 Q 125 275 230 260"/>
    </g>
    <!-- glossy film sheen -->
    <rect x="0" y="0" width="250" height="300" rx="10" fill="url(#sheen)"/>
    <ellipse cx="70" cy="70" rx="55" ry="18" fill="#ffffff" opacity="0.35" transform="rotate(-25 70 70)"/>
  </g>

  <!-- center seam highlight -->
  <rect x="396" y="150" width="8" height="300" fill="#0f172a" opacity="0.25"/>

  <!-- oil bottle on the left side, matte -->
  <g transform="translate(210 470)">
    <rect x="-22" y="0" width="44" height="60" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <rect x="-10" y="-24" width="20" height="26" rx="4" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <rect x="-16" y="12" width="32" height="34" rx="3" fill="#f97316" opacity="0.9"/>
  </g>

  <!-- brush on the right side, glossy -->
  <g transform="translate(560 470)">
    <rect x="-6" y="-40" width="12" height="55" rx="4" fill="#7c4a24"/>
    <rect x="-20" y="10" width="40" height="26" rx="4" fill="#facc15"/>
    <rect x="-20" y="30" width="40" height="14" fill="#e2e8f0"/>
  </g>

  <!-- small labels via simple iconography (no text): sun rays over left (natural/matte), gloss dot over right -->
  <g transform="translate(275 110)" opacity="0.85">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#facc15" stroke-width="4"/>
  </g>
  <g transform="translate(525 110)" opacity="0.85">
    <circle cx="0" cy="0" r="16" fill="#facc15"/>
    <circle cx="-5" cy="-5" r="5" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
