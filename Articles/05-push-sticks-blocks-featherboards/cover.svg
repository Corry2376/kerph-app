<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="top5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="wood5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#bg5)"/>
  <circle cx="700" cy="90" r="150" fill="#0f172a" opacity="0.16"/>
  <circle cx="90" cy="520" r="170" fill="#0f172a" opacity="0.18"/>

  <!-- table saw top, birds-eye -->
  <g transform="translate(120,160)">
    <rect x="0" y="0" width="560" height="280" rx="16" fill="url(#top5)" stroke="#94a3b8" stroke-width="4"/>
    <!-- miter slots -->
    <rect x="60" y="0" width="14" height="280" fill="#94a3b8" opacity="0.6"/>
    <rect x="486" y="0" width="14" height="280" fill="#94a3b8" opacity="0.6"/>
    <!-- blade slot -->
    <rect x="260" y="0" width="12" height="280" fill="#64748b"/>
    <!-- fence -->
    <rect x="330" y="-14" width="16" height="308" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>

    <!-- board being ripped, entering from left -->
    <rect x="-140" y="110" width="330" height="46" rx="4" fill="url(#wood5)" stroke="#ca8a04" stroke-width="3"/>
    <g stroke="#ca8a04" stroke-width="2" opacity="0.5">
      <line x1="-120" y1="120" x2="150" y2="120"/>
      <line x1="-120" y1="146" x2="150" y2="146"/>
    </g>

    <!-- featherboard clamped to fence, angled fingers -->
    <g transform="translate(210,10) rotate(20)">
      <rect x="0" y="0" width="70" height="90" rx="6" fill="#f97316"/>
      <g stroke="#c2410c" stroke-width="3">
        <line x1="8" y1="10" x2="8" y2="80"/>
        <line x1="20" y1="10" x2="20" y2="80"/>
        <line x1="32" y1="10" x2="32" y2="80"/>
        <line x1="44" y1="10" x2="44" y2="80"/>
        <line x1="56" y1="10" x2="56" y2="80"/>
      </g>
    </g>

    <!-- push stick behind board, hand end off right side of board -->
    <g transform="translate(60,95) rotate(-4)">
      <path d="M0 30 L170 10 L200 0 L215 18 L195 32 L170 40 L0 55 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
      <path d="M0 30 L0 55 L-14 60 L-14 24 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    </g>
  </g>

  <!-- push block icon, lower right -->
  <g transform="translate(560,410)">
    <rect x="0" y="30" width="150" height="60" rx="14" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
    <rect x="20" y="0" width="46" height="40" rx="10" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
    <rect x="90" y="0" width="46" height="40" rx="10" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
    <g fill="#c2410c">
      <rect x="14" y="46" width="10" height="30" rx="4"/>
      <rect x="34" y="46" width="10" height="30" rx="4"/>
      <rect x="106" y="46" width="10" height="30" rx="4"/>
      <rect x="126" y="46" width="10" height="30" rx="4"/>
    </g>
  </g>
</svg>
